name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python syntax and unit tests
        run: |
          python3 -m py_compile scripts/*.py tests/fixtures/fake_usi.py
          python3 -m unittest discover -s tests -v
      - name: Nonlinear compiled source snapshot
        run: python3 -B -m unittest discover -s preparations/white-view-paired-nonlinear-rust-v1 -p test_public_source.py -v
      - name: Raw master diagnostic sampler and source snapshot
        run: python3 -B -m unittest discover -s preparations/raw-master-quantization-diagnostic-v1 -p 'test_*.py' -v
      - name: JSON configuration
        run: |
          python3 -m json.tool config/toolchain.lock.json >/dev/null
          python3 -m json.tool config/smoke.json >/dev/null
          python3 -m json.tool config/quest-corpus.json >/dev/null
          python3 -m json.tool config/development-benchmark.json >/dev/null
          python3 -m json.tool benchmarks/shogiquest-v1/manifest.json >/dev/null
          test "$(find benchmarks/shogiquest-v1/development -name '*.csa' -type f | wc -l)" -eq 5
          git diff --check
      # The real engine smoke is run locally: the teacher is not redistributed to CI.
